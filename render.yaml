# Blueprint do Render. Ao ligar o repositorio, o Render le este ficheiro.
# Os valores com "sync: false" sao preenchidos no painel do Render (nao aqui).
services:
  - type: web
    name: parking-recife
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run db:schema && npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: TARIFA_HORA
        value: "10"
      - key: EMPRESA_NOME
        value: ESTACIONAMENTO RECIFE
      - key: EMPRESA_CNPJ
        value: 62.580.141/0001-88
      - key: EMPRESA_TELEFONE
        value: 81-9.8612-5798
      - key: EMPRESA_RODAPE
        value: Obrigado e volte sempre!
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
